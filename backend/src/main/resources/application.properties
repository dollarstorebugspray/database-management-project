spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/grocery_store
spring.datasource.username=grocery_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

server.port=8080

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@grocerystore.local}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin123!}
app.demo.accounts-enabled=${DEMO_ACCOUNTS_ENABLED:true}
app.demo.salesperson-email=salesperson@grocerystore.local
app.demo.salesperson-password=Salesperson123!
app.demo.salesperson-id=2
app.demo.customer-email=customer@grocerystore.local
app.demo.customer-password=Customer123!
app.demo.customer-id=1
app.demo.business-email=business@grocerystore.local
app.demo.business-password=Business123!
app.demo.business-customer-id=2
